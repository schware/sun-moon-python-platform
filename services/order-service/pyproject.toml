[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "order-service"
version = "0.1.0"
description = "Order bounded context — independently deployable service"
requires-python = ">=3.11"
dependencies = [
    "netframework-core",
    "netframework-comms",
    "netframework-contracts",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
netframework-core = { workspace = true }
netframework-comms = { workspace = true }
netframework-contracts = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
