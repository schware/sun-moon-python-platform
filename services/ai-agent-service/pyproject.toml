[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-agent-service"
version = "0.1.0"
description = "AI assistant service — talks to order-service over HTTP + Redis, never imports its code"
requires-python = ">=3.11"
dependencies = [
    "netframework-core",
    "netframework-ai-agent",
    "netframework-comms",
    "netframework-contracts",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
anthropic = ["netframework-ai-agent[anthropic]"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
netframework-core = { workspace = true }
netframework-ai-agent = { workspace = true }
netframework-comms = { workspace = true }
netframework-contracts = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
