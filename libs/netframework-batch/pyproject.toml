[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netframework-batch"
version = "0.1.0"
description = "Generic Job/Step/Chunk batch-processing engine (Reader/Processor/Writer), no I/O opinions of its own"
requires-python = ">=3.11"
dependencies = ["netframework-core"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
netframework-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
