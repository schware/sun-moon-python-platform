[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "netframework-core"
version = "0.1.0"
description = "Shared kernel: config, logging, DDD base types, persistence helpers, event buses"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pydantic-settings>=2.2",
    "sqlalchemy>=2.0",
    "structlog>=24.1",
    "redis>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
